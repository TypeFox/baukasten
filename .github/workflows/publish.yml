name: Publish

permissions:
    contents: read
    id-token: write

on:
    push:
        # Releases so far are tagged without a prefix (0.3.0); accept both forms.
        # The `publish` environment must allow these tags in its deployment rules,
        # otherwise GitHub rejects the job before it starts.
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - '[0-9]+.[0-9]+.[0-9]+'

# Never let two publish runs race each other
concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        name: Baukasten Publish
        runs-on: ubuntu-latest
        environment: publish
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: '22'
                  # Required by the publish action for --provenance
                  registry-url: 'https://registry.npmjs.org'

            # OIDC trusted publishing needs npm >= 11.5.1. Pin the major so a new
            # npm release (npm 12 already dropped Node 20) cannot break a publish.
            - name: Upgrade npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: Run checks
              run: npm run lint && npm run format:check

            - name: Build all packages
              run: npm run build

            - name: Publish
              # Pin the version to a full commit SHA for supply-chain safety
              uses: TypeFox/gh-publish-npm@7183224bef010236e419a2367208633ff284337a
              with:
                  # Newline-separated. Only non-private, npm-published packages belong here.
                  npm-packages: |
                      packages/baukasten
                      packages/web-wrapper
