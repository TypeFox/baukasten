name: Publish (next)

# Publishes a "next" snapshot of the public baukasten packages to npm under
# the `next` dist-tag. Runs on every push to main that touches a published
# package, and can be triggered manually (optionally as a dry run).
#
# Mirrors publish.yml (checkout/setup-node pins, npm upgrade, lint/format
# checks, build, gh-publish-npm with OIDC trusted publishing), but first
# bumps to a prerelease version via the root "prepare-next" script and
# publishes under the `next` tag instead of `latest`.
#
# The prerelease version is <next minor>-next.<HEAD commit time, UTC>, e.g.
# 0.4.0-next.20260924103000. It must sort above both `latest` and the current
# `next`, otherwise gh-publish-npm treats the package as up to date and skips it.

on:
    push:
        branches:
            - 'main'
        # Only changes to the published packages warrant a new snapshot
        paths:
            - 'packages/baukasten/**'
            - 'packages/web-wrapper/**'
    workflow_dispatch:
        inputs:
            dry-run:
                description: 'Run every step but only simulate the npm publish'
                type: boolean
                default: false

permissions:
    contents: read
    id-token: write # Required for npm OIDC trusted publishing

# Own group, not `publish`: GitHub keeps only one pending run per group and
# cancels the older one, so a burst of merges could cancel a queued stable
# release. Within this group that same behavior is what we want: at most one
# run in flight plus one pending for the newest commit.
concurrency:
    group: publish-next
    cancel-in-progress: false

jobs:
    publish-next:
        name: Baukasten Publish (next)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: '22'
                  # Required by the publish action for --provenance
                  registry-url: 'https://registry.npmjs.org'

            # OIDC trusted publishing needs npm >= 11.5.1. Pin the major so a new
            # npm release cannot break a publish.
            - name: Upgrade npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: Run checks
              run: npm run lint && npm run format:check

            - name: Build all packages
              run: npm run build

            - name: Prepare next version
              # Bumps each workspace to a prerelease version via its
              # "prepare:next" script where present.
              run: npm run prepare-next

            - name: Publish
              # Pin the version to a full commit SHA for supply-chain safety
              uses: TypeFox/gh-publish-npm@7183224bef010236e419a2367208633ff284337a
              with:
                  npm-tag: next
                  # `inputs` is empty on push events; compare so it is always 'true'/'false'
                  dry-run: ${{ inputs.dry-run == true }}
                  # Newline-separated. Only non-private, npm-published packages belong here.
                  npm-packages: |
                      packages/baukasten
                      packages/web-wrapper
